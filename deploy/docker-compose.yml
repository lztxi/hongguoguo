# 玩客云部署用：只拉 GHCR 镜像，不在本机编译（armv7 / 988MB 内存很吃紧）。
# IMAGE 在同目录 .env 里配置，或直接作为环境变量传给 deploy/*.sh。
# 显式声明 project name，换目录部署时也不会残留旧容器 / 旧网络。
name: hongguo-web

services:
  hongguo-web:
    image: ${IMAGE:-ghcr.io/lztxi/hongguoguo:latest}
    container_name: hongguo-web
    platform: linux/arm/v7
    restart: unless-stopped
    ports:
      # 636 是 LDAPS，被 Chromium 列入不安全端口黑名单，必须用 9636
      - "9636:9636"
    environment:
      TZ: Asia/Shanghai
      PORT: "9636"
      HONGGUO_DATA_DIR: /app/data
      # 播放时 heap 峰值约 24MB；压到 128MB 让 V8 及时回收 ArrayBuffer
      NODE_OPTIONS: "--max-old-space-size=128 --expose-gc"
      # 长时间无人使用时自动清缓存 + full GC（心跳/SSE 不算使用，播放中绝不降级）
      HONGGUO_IDLE_SLEEP_MINUTES: "${IDLE_SLEEP_MINUTES:-30}"
      # 设为 0 可一键禁用空闲降级，回到旧行为
      HONGGUO_IDLE_SLEEP: "${IDLE_SLEEP:-1}"
      # 连播预热：提前备好后续 3 集的播放计划；1=旧行为，0=禁用
      HONGGUO_HGOP_WARM_DEPTH: "${HONGGUO_HGOP_WARM_DEPTH:-3}"
      # 计划存活 10 分钟，避免一集没看完预热就过期
      HONGGUO_HGOP_PLAN_TTL_MIN: "${HONGGUO_HGOP_PLAN_TTL_MIN:-10}"
      # 首片预缓冲：每集提前备好 1MB 已解密开头数据，总量封顶 4MB；MB 设 0 禁用
      HONGGUO_HGOP_PREBUF_MB: "${HONGGUO_HGOP_PREBUF_MB:-1}"
      HONGGUO_HGOP_PREBUF_LIMIT_MB: "${HONGGUO_HGOP_PREBUF_LIMIT_MB:-4}"
      # 预热避让：首片稳定后再启动预热，不抢首播带宽；DELAY 设 0 回到立刻预热
      HONGGUO_HGOP_WARM_DELAY_MS: "${HONGGUO_HGOP_WARM_DELAY_MS:-2000}"
      HONGGUO_HGOP_WARM_TRIGGER_KB: "${HONGGUO_HGOP_WARM_TRIGGER_KB:-512}"
      # 上游取源容错：红果接口空响应时播放自动重试、预热熔断退避；GUARD=0 关闭
      HONGGUO_UPSTREAM_GUARD: "${HONGGUO_UPSTREAM_GUARD:-1}"
      HONGGUO_UPSTREAM_FAIL_THRESHOLD: "${HONGGUO_UPSTREAM_FAIL_THRESHOLD:-3}"
      HONGGUO_UPSTREAM_RETRY_MAX: "${HONGGUO_UPSTREAM_RETRY_MAX:-2}"
      HONGGUO_UPSTREAM_RETRY_BASE_MS: "${HONGGUO_UPSTREAM_RETRY_BASE_MS:-1200}"
      HONGGUO_UPSTREAM_RETRY_DEADLINE_MS: "${HONGGUO_UPSTREAM_RETRY_DEADLINE_MS:-20000}"
      HONGGUO_UPSTREAM_COOLDOWN_MS: "${HONGGUO_UPSTREAM_COOLDOWN_MS:-30000}"
      HONGGUO_UPSTREAM_COOLDOWN_MAX_MS: "${HONGGUO_UPSTREAM_COOLDOWN_MAX_MS:-300000}"
    volumes:
      # 设置 / 下载任务 / 观看历史 / 账号会话 / 已下载视频 —— 升级绝不覆盖
      - ./data:/app/data
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
