# 玩客云部署用：只拉 GHCR 镜像，不在本机编译（armv7 / 988MB 内存很吃紧）。
# IMAGE 在同目录 .env 里配置，或直接作为环境变量传给 deploy/*.sh。
# 显式声明 project name，换目录部署时也不会残留旧容器 / 旧网络。
name: hongguo-web

services:
  hongguo-web:
    image: ${IMAGE:-ghcr.io/lztxi/hongguoguo:latest}
    container_name: hongguo-web
    platform: linux/arm/v7
    restart: unless-stopped
    ports:
      # 636 是 LDAPS，被 Chromium 列入不安全端口黑名单，必须用 9636
      - "9636:9636"
    environment:
      TZ: Asia/Shanghai
      PORT: "9636"
      HONGGUO_DATA_DIR: /app/data
      # 播放时 heap 峰值约 24MB；压到 128MB 让 V8 及时回收 ArrayBuffer
      NODE_OPTIONS: "--max-old-space-size=128 --expose-gc"
      # 长时间无人使用时自动清缓存 + full GC（心跳/SSE 不算使用，播放中绝不降级）
      HONGGUO_IDLE_SLEEP_MINUTES: "${IDLE_SLEEP_MINUTES:-30}"
      # 设为 0 可一键禁用空闲降级，回到旧行为
      HONGGUO_IDLE_SLEEP: "${IDLE_SLEEP:-1}"
      # 连播预热：提前备好后续 3 集的播放计划；1=旧行为，0=禁用
      HONGGUO_HGOP_WARM_DEPTH: "${HONGGUO_HGOP_WARM_DEPTH:-3}"
      # 计划存活 10 分钟，避免一集没看完预热就过期
      HONGGUO_HGOP_PLAN_TTL_MIN: "${HONGGUO_HGOP_PLAN_TTL_MIN:-10}"
    volumes:
      # 设置 / 下载任务 / 观看历史 / 账号会话 / 已下载视频 —— 升级绝不覆盖
      - ./data:/app/data
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
